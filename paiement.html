<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>OER — Statut de paiement</title><link rel="stylesheet" href="/style.css"/></head><body><header><a href="/"><strong>◈ OER</strong></a></header><main><section><h1>Statut de votre paiement</h1><div class="box"><p id="status" role="status">Vérification du paiement auprès de Mollie…</p><a class="action" href="/services.html"><button>Retour aux services</button></a></div></section></main><script>const id=new URLSearchParams(location.search).get('order');const el=document.querySelector('#status');if(!id){el.textContent='Référence de commande manquante'}else{fetch('/api/payment-status?order='+encodeURIComponent(id)).then(r=>r.json()).then(d=>{el.textContent=d.status==='paid'?'Paiement confirmé pour '+d.productName+'. Référence de commande : '+id:d.status==='pending'||d.status==='open'?'Paiement en attente de confirmation. Référence : '+id:d.status==='failed'||d.status==='canceled'||d.status==='expired'?'Paiement non abouti. Vous pouvez réessayer depuis le catalogue.':'État : '+(d.status||d.error||'indisponible')}).catch(()=>el.textContent='Statut temporairement indisponible. Réessayez plus tard.')}</script></body></html>
