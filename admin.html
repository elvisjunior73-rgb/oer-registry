<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greffe OER — Espace privé</title><style>body{font:16px system-ui;background:#071625;color:#edf8fa;max-width:850px;margin:45px auto;padding:20px}input,button,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #5d8499}input{background:#142e40;color:white;width:100%;box-sizing:border-box}button{background:#42d7c0;color:#072032;cursor:pointer;margin:6px}article{background:#10283b;padding:20px;border-radius:12px;margin:14px 0}small{color:#a6becb}#status{white-space:pre-wrap}</style></head><body><h1>Greffe OER</h1><p>Accès réservé à l'administrateur habilité. Chaque dossier doit être contrôlé avant validation.</p><label>Clé d'administration <input id="token" type="password" autocomplete="off" placeholder="Saisir la clé privée"></label><button id="load">Charger les dossiers</button><p id="status" role="status"></p><div id="items"></div><script>
const status=document.getElementById('status'),items=document.getElementById('items'),token=document.getElementById('token');
const api=async(method,body)=>{const r=await fetch('/api/admin',{method,headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error('Le serveur OER a retourné une erreur ('+r.status+'). Réessayez ou contactez le support.' )}if(!r.ok)throw Error(d.error||'Erreur');return d};
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
document.getElementById('load').onclick=async()=>{status.textContent='Chargement…';items.replaceChildren();try{const d=await api('GET');status.textContent=d.applications.length+' dossier(s) enregistré(s)';for(const x of d.applications){const card=el('article',''),h=el('h3',x.business+' · '+x.category),p=el('p','Réf : '+x.ref+' | Représentant : '+x.name+' | '+x.email),approve=el('button','Approuver et émettre IOE'),reject=el('button','Rejeter');approve.onclick=()=>decide(x,'approve');reject.onclick=()=>decide(x,'reject');card.append(h,p,approve,reject);items.append(card)}}catch(e){status.textContent=e.message}};
async function decide(x,decision){if(!confirm((decision==='approve'?'Confirmer la validation et la délivrance du certificat pour ':'Rejeter définitivement le dossier de ')+x.business+' ?'))return;status.textContent='Traitement…';try{const d=await api('POST',{reference:x.ref,decision});status.textContent=decision==='approve'?'IOE émis : '+d.ioe+' | Email envoyé : '+d.notified:'Dossier rejeté';}catch(e){status.textContent=e.message}}
</script></body></html>
